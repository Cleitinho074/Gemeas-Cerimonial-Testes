services:
  - type: web
    name: gemeas-cerimonial
    runtime: node
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ORIGIN
        value: https://gemeas-cerimonial-dgbq.onrender.com
      - key: DATABASE_URL
        sync: false
